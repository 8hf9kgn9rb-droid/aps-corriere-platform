<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>APS Corriere Platform v0.8.5</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f7fb;color:#172033}
    .boot{min-height:100vh;display:grid;place-items:center;padding:20px}
    .card{max-width:680px;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:28px 32px;box-shadow:0 10px 35px rgba(18,31,53,.08);text-align:center}
    .logo{font-weight:900;font-size:22px;margin-bottom:8px}
    .muted{color:#6b7280;font-size:13px;line-height:1.55}
  </style>
</head>
<body>
  <div class="boot"><div class="card"><div class="logo">APS Corriere</div><div class="muted">Caricamento piattaforma…</div></div></div>

  <script>
  (async function(){
    try{
      const response = await fetch("./index%20%286%29.html?v=083", {cache:"no-store"});
      if(!response.ok) throw new Error("Base v0.8.3 non disponibile: HTTP "+response.status);

      let base = await response.text();

      base = base.replace(
        '<title>APS Corriere Platform v0.8.3</title>',
        '<title>APS Corriere Platform v0.8.4</title>'
      );

      const patch = "// APS Corriere v0.8.4 — gerarchia ticket\n(function(){\n  const byId=id=>state.users.find(u=>u.id===id);\n  const superUser=()=>state.users.find(u=>u.role==='super');\n  const parentOf=u=>u?.parentId?byId(u.parentId):null;\n  const company=u=>u?.company||u?.name||'Utente';\n\n  function descendantIds(rootId){\n    const out=[];\n    const walk=id=>{\n      for(const u of state.users.filter(x=>x.parentId===id)){\n        if(out.includes(u.id))continue;\n        out.push(u.id);\n        walk(u.id);\n      }\n    };\n    walk(rootId);\n    return out;\n  }\n\n  descendants=function(user){\n    if(user.role==='client')return [user.id];\n    if(user.role==='super')return state.users.map(u=>u.id);\n    return [user.id,...descendantIds(user.id)];\n  };\n\n  visibleMasters=function(user=me()){\n    if(user.role==='super')return state.users.filter(u=>u.role==='master');\n    if(user.role==='master'){\n      const ids=new Set(descendantIds(user.id));\n      return state.users.filter(u=>u.role==='master'&&ids.has(u.id));\n    }\n    return [];\n  };\n\n  visibleClients=function(user=me()){\n    if(user.role==='super')return state.users.filter(u=>u.role==='client');\n    if(user.role==='master'){\n      const ids=new Set(descendantIds(user.id));\n      return state.users.filter(u=>u.role==='client'&&ids.has(u.id));\n    }\n    return [];\n  };\n\n  visibleShipments=function(user=me()){\n    if(user.role==='super')return state.shipments;\n    if(user.role==='master'){\n      const ids=new Set([user.id,...descendantIds(user.id)]);\n      return state.shipments.filter(s=>ids.has(s.ownerId)||ids.has(s.masterId));\n    }\n    return state.shipments.filter(s=>s.ownerId===user.id);\n  };\n\n  function routeContains(t,id){\n    return Array.isArray(t.routeIds)&&t.routeIds.includes(id);\n  }\n\n  visibleTickets=function(user=me()){\n    const rows=state.tickets||[];\n    if(user.role==='super'){\n      return rows.filter(t=>routeContains(t,user.id)||t.currentHolderId===user.id||t.requesterId===user.id||!t.currentHolderId);\n    }\n    if(user.role==='master'){\n      return rows.filter(t=>routeContains(t,user.id)||t.currentHolderId===user.id||t.requesterId===user.id);\n    }\n    return rows.filter(t=>t.requesterId===user.id||t.clientId===user.id);\n  };\n\n  function nextStatusFor(user){\n    if(!user)return 'Da assegnare';\n    return user.role==='super'?'In attesa Super Master':`In attesa ${company(user)}`;\n  }\n\n  buildTicket=function({shipmentId='',category='Altro',subject='',message=''}={}){\n    const u=me();\n    const s=shipmentId?state.shipments.find(x=>x.id===shipmentId):null;\n    const clientId=s?.ownerId||(u.role==='client'?u.id:null);\n    const client=byId(clientId);\n    const directMaster=client?parentOf(client):(u.role==='master'?u:null);\n    const sm=superUser();\n\n    const t={\n      id:'TCK'+Date.now().toString().slice(-8)+Math.random().toString(36).slice(2,4).toUpperCase(),\n      requesterId:u.id,\n      clientId:clientId||null,\n      masterId:directMaster?.id||s?.masterId||(u.role==='master'?u.id:null),\n      shipmentId:shipmentId||null,\n      category,\n      subject:subject||category,\n      message:message||'',\n      source:'Manuale',\n      auto:false,\n      externalTicketId:null,\n      created:new Date().toISOString(),\n      updated:new Date().toISOString(),\n      history:[],\n      routeIds:[u.id],\n      currentHolderId:null,\n      status:'Aperto'\n    };\n\n    ticketHistoryPush(t,company(u),`Ticket aperto da ${roleLabel(u.role)}`,'apertura');\n\n    // Caso Cliente: Cliente -> Master diretto -> Super Master.\n    // Il passaggio dal Master diretto al Super Master è automatico.\n    if(u.role==='client'){\n      const m=parentOf(u);\n      if(m&&m.role==='master'){\n        t.routeIds.push(m.id);\n        ticketHistoryPush(t,company(m),'Ticket ricevuto dal cliente','master');\n      }\n      if(sm){\n        if(!t.routeIds.includes(sm.id))t.routeIds.push(sm.id);\n        t.currentHolderId=sm.id;\n        t.status='In attesa Super Master';\n        ticketHistoryPush(t,'Super Master','Ticket inoltrato automaticamente dal Master del cliente','super');\n      }else{\n        t.status='Da assegnare';\n      }\n    }\n    // Caso Master: il ticket sale al superiore diretto e va inoltrato livello per livello.\n    else if(u.role==='master'){\n      const p=parentOf(u);\n      if(p){\n        if(!t.routeIds.includes(p.id))t.routeIds.push(p.id);\n        t.currentHolderId=p.id;\n        t.status=nextStatusFor(p);\n        ticketHistoryPush(t,company(p),'Ticket ricevuto dal livello inferiore','ricezione');\n      }else{\n        t.status='Da assegnare';\n      }\n    }\n    else{\n      t.currentHolderId=u.id;\n      t.status='Pronto per invio';\n    }\n\n    return t;\n  };\n\n  window.forwardTicketToParent=function(id){\n    const t=(state.tickets||[]).find(x=>x.id===id);\n    const u=me();\n    if(!t||u.role!=='master'||t.currentHolderId!==u.id){\n      toast('Questo ticket non è assegnato al tuo livello','error');\n      return;\n    }\n\n    const p=parentOf(u);\n    if(!p){\n      toast('Nessun superiore configurato','error');\n      return;\n    }\n\n    if(!Array.isArray(t.routeIds))t.routeIds=[];\n    if(!t.routeIds.includes(p.id))t.routeIds.push(p.id);\n    t.currentHolderId=p.id;\n    t.status=nextStatusFor(p);\n    ticketHistoryPush(t,company(u),`Ticket inoltrato a ${p.role==='super'?'Super Master':company(p)}`,'inoltro');\n    save();\n\n    toast(p.role==='super'?'Ticket inviato al Super Master':'Ticket inoltrato al Master superiore');\n    render();\n  };\n\n  const oldSend=sendTicketExternally;\n  sendTicketExternally=async function(t){\n    const sm=superUser();\n    if(me().role!=='super'||(t.currentHolderId&&t.currentHolderId!==sm?.id)){\n      toast('Il ticket deve prima arrivare al Super Master','error');\n      return false;\n    }\n    return oldSend(t);\n  };\n\n  ticketStatusClass=function(s){\n    if(['Risolto','Chiuso','Inviato'].includes(s))return'ok';\n    if(String(s||'').startsWith('In attesa')||['Pronto per invio','Invio non disponibile','In gestione'].includes(s))return'warn';\n    return'info';\n  };\n\n  ticketRowHtml=function(t){\n    const s=t.shipmentId?state.shipments.find(x=>x.id===t.shipmentId):null;\n    const client=byId(t.clientId);\n    const master=byId(t.masterId);\n    const holder=byId(t.currentHolderId);\n    const u=me();\n\n    const canForward=\n      u.role==='master' &&\n      t.currentHolderId===u.id &&\n      !['Risolto','Chiuso','Inviato'].includes(t.status);\n\n    const canSend=\n      u.role==='super' &&\n      (!t.currentHolderId||t.currentHolderId===u.id) &&\n      !['Risolto','Chiuso','Inviato'].includes(t.status);\n\n    return `<div class=\"ticket-card\">\n      <div class=\"ticket-card-head\">\n        <div>\n          <h4>${esc(t.subject||('Ticket '+t.id))}</h4>\n          <p>${esc(t.message||'Nessun messaggio')}</p>\n        </div>\n        <span class=\"ticket-chip ${ticketStatusClass(t.status)}\">${esc(t.status)}</span>\n      </div>\n\n      <div class=\"ticket-meta\">\n        ${t.ldv?`<span class=\"ticket-chip info\">LDV: ${esc(t.ldv)}</span>`:''}\n        ${s?`<span class=\"ticket-chip\">${esc(s.id)} · ${esc(s.tracking)}</span>`:''}\n        ${client?`<span class=\"ticket-chip\">Cliente: ${esc(company(client))}</span>`:''}\n        ${master?`<span class=\"ticket-chip\">Master diretto: ${esc(company(master))}</span>`:''}\n        ${holder?`<span class=\"ticket-chip info\">Ora a: ${esc(holder.role==='super'?'Super Master':company(holder))}</span>`:''}\n        ${t.content?`<span class=\"ticket-chip\">Contenuto: ${esc(t.content)}</span>`:''}\n        ${t.packaging?`<span class=\"ticket-chip\">Imballaggio: ${esc(t.packaging)}</span>`:''}\n      </div>\n\n      ${ticketAttachmentNames(t).length\n        ? `<div class=\"ticket-meta\">${ticketAttachmentNames(t).map(a=>`<span class=\"ticket-chip\">📎 ${esc(a.name)}</span>`).join('')}</div>`\n        : ''}\n\n      <div class=\"ticket-history\">\n        ${(t.history||[]).slice(-8).map(h=>`<div class=\"ticket-history-row\">\n          <div class=\"ticket-history-dot\"></div>\n          <div>\n            <strong>${esc(h.actor)}</strong>\n            <span>${esc(h.text)} · ${esc(new Date(h.at).toLocaleString('it-IT'))}</span>\n          </div>\n        </div>`).join('')}\n      </div>\n\n      <div class=\"entity-actions\">\n        ${canForward?`<button class=\"btn btn-primary ticketForward\" data-id=\"${t.id}\">Inoltra al superiore</button>`:''}\n        ${canSend?`<button class=\"btn btn-primary ticketSend\" data-id=\"${t.id}\">Invia segnalazione</button>`:''}\n        ${u.role==='super'&&t.status!=='Risolto'\n          ? `<button class=\"btn btn-secondary ticketResolve\" data-id=\"${t.id}\">Segna risolto</button>`\n          : ''}\n        ${t.externalTicketId?`<span class=\"tag blue\">ID ${esc(t.externalTicketId)}</span>`:''}\n      </div>\n    </div>`;\n  };\n\n  ticketsPage=function(){\n    const rows=visibleTickets().sort((a,b)=>new Date(b.updated)-new Date(a.updated));\n    const open=rows.filter(t=>!['Risolto','Chiuso'].includes(t.status)).length;\n    const waiting=rows.filter(t=>String(t.status||'').startsWith('In attesa')).length;\n    const sent=rows.filter(t=>t.status==='Inviato').length;\n    const canOpen=me().role==='client'||me().role==='master';\n\n    const compose=canOpen?`<div class=\"ticket-compose\">\n      <h3>Nuovo ticket</h3>\n      <form id=\"ticketInlineForm\">\n        <div class=\"field\">\n          <label>LDV</label>\n          <input id=\"ticketLDV\" placeholder=\"Numero LDV della spedizione\">\n        </div>\n        <div class=\"field\">\n          <label>Contenuto <span class=\"ticket-required\">* obbligatorio</span></label>\n          <input id=\"ticketContent\" required placeholder=\"Cosa c'era nel collo\">\n        </div>\n        <div class=\"field\">\n          <label>Imballaggio <span class=\"ticket-required\">* obbligatorio</span></label>\n          <input id=\"ticketPackaging\" required placeholder=\"Com'era imballato\">\n        </div>\n        <div class=\"field\">\n          <label>Messaggio <span class=\"ticket-required\">*</span></label>\n          <textarea id=\"ticketMessage\" required placeholder=\"Descrivi il problema o la richiesta...\"></textarea>\n        </div>\n        <div class=\"field\">\n          <label>Allegati (foto/PDF)</label>\n          <div class=\"ticket-drop\" id=\"ticketDrop\">\n            <input id=\"ticketFiles\" type=\"file\" multiple accept=\"image/*,.pdf,application/pdf\">\n            <div>\n              <strong>📎 Trascina qui foto o PDF, oppure clicca per scegliere</strong>\n              <span class=\"small muted\">Puoi allegare più file</span>\n            </div>\n          </div>\n          <div id=\"ticketFilesList\" class=\"ticket-files\"></div>\n        </div>\n        <button class=\"btn ticket-submit\" type=\"submit\">Invia ticket</button>\n      </form>\n    </div>`:'';\n\n    return `${pageHead(\n      'Assistenza — Ticket',\n      canOpen?'Apri un ticket e segui il passaggio nella tua gerarchia.':'Gestione dei ticket arrivati al tuo livello.',\n      ''\n    )}\n    <div class=\"kpi-grid\">\n      ${kpi('Ticket visibili',rows.length,'✉','Nel tuo perimetro')}\n      ${kpi('Ticket aperti',open,'!','Da gestire')}\n      ${kpi('In attesa livello superiore',waiting,'⌛','Nella gerarchia')}\n      ${kpi('Segnalazioni inviate',sent,'✓','Completate')}\n    </div>\n    <div class=\"ticket-page-grid\">\n      <div>\n        ${compose}\n        <div class=\"ticket-list-panel\">\n          <div class=\"ticket-list\">${rows.map(ticketRowHtml).join('')||'<div class=\"panel\"><div class=\"panel-body\"><div class=\"empty\"><strong>Nessun ticket</strong>Non ci sono ancora richieste.</div></div></div>'}</div>\n        </div>\n      </div>\n      <div class=\"ticket-side-note\">\n        <h4>Flusso ticket APS</h4>\n        <div class=\"ticket-flow\">\n          <div class=\"ticket-flow-step\"><b>1</b><span>Cliente o Master apre il ticket</span></div>\n          <div class=\"ticket-flow-step\"><b>2</b><span>Il ticket segue il superiore previsto dalla gerarchia</span></div>\n          <div class=\"ticket-flow-step\"><b>3</b><span>Il Super Master riceve la richiesta</span></div>\n          <div class=\"ticket-flow-step\"><b>4</b><span>Solo il Super Master effettua l'invio finale</span></div>\n        </div>\n      </div>\n    </div>`;\n  };\n\n  initTicketInlineForm=function(){\n    const form=document.getElementById('ticketInlineForm');\n    if(!form)return;\n\n    let files=[];\n    const input=document.getElementById('ticketFiles');\n    const drop=document.getElementById('ticketDrop');\n    const list=document.getElementById('ticketFilesList');\n\n    const renderFiles=()=>{\n      list.innerHTML=files.map((f,i)=>`<div class=\"ticket-file\">\n        <span>📎</span>\n        <div class=\"grow\">\n          <strong>${esc(f.name)}</strong>\n          <span>${Math.max(1,Math.round(f.size/1024))} KB</span>\n        </div>\n        <button type=\"button\" data-rm=\"${i}\">Rimuovi</button>\n      </div>`).join('');\n      list.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{\n        files.splice(+b.dataset.rm,1);\n        renderFiles();\n      });\n    };\n\n    const addFiles=incoming=>{\n      for(const f of Array.from(incoming||[])){\n        const ok=f.type.startsWith('image/')||f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf');\n        if(!ok)continue;\n        if(f.size>10*1024*1024){\n          toast(`File troppo grande: ${f.name}`,'error');\n          continue;\n        }\n        if(files.length>=6){\n          toast('Puoi allegare massimo 6 file','error');\n          break;\n        }\n        files.push(f);\n      }\n      renderFiles();\n    };\n\n    input.addEventListener('change',()=>{\n      addFiles(input.files);\n      input.value='';\n    });\n\n    ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{\n      e.preventDefault();\n      drop.classList.add('dragover');\n    }));\n    ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{\n      e.preventDefault();\n      drop.classList.remove('dragover');\n    }));\n    drop.addEventListener('drop',e=>addFiles(e.dataTransfer.files));\n\n    form.onsubmit=e=>{\n      e.preventDefault();\n\n      const ldv=document.getElementById('ticketLDV').value.trim();\n      const content=document.getElementById('ticketContent').value.trim();\n      const packaging=document.getElementById('ticketPackaging').value.trim();\n      const message=document.getElementById('ticketMessage').value.trim();\n\n      if(!content||!packaging||!message){\n        toast('Compila i campi obbligatori','error');\n        return;\n      }\n\n      const shipment=guessShipmentByLDV(ldv);\n      const t=buildTicket({\n        shipmentId:shipment?.id||'',\n        category:'Assistenza',\n        subject:ldv?`Ticket LDV ${ldv}`:'Nuovo ticket assistenza',\n        message\n      });\n\n      t.ldv=ldv;\n      t.content=content;\n      t.packaging=packaging;\n      t.attachments=files.map(f=>({name:f.name,size:f.size,type:f.type||''}));\n\n      state.tickets.unshift(t);\n      save();\n\n      toast('Ticket inviato');\n      currentView='tickets';\n      render();\n    };\n  };\n\n  // Un Master può creare un Master subordinato.\n  if(!menus.master.some(x=>x[1]==='masters')){\n    const i=menus.master.findIndex(x=>x[1]==='clients');\n    if(i>=0){\n      menus.master[i][0]='';\n      menus.master.splice(i,0,['RETE','masters','◆','I miei Master']);\n    }\n  }\n\n  mastersPage=function(){\n    const u=me();\n    if(u.role==='client')return dashboardPage();\n\n    const arr=state.users.filter(x=>x.role==='master'&&x.parentId===u.id);\n    return `${pageHead(\n      u.role==='super'?'Master':'I miei Master',\n      'Gestisci i Master direttamente collegati al tuo livello.',\n      `<button class=\"btn btn-primary\" id=\"addMasterBtn\">＋ Nuovo Master</button>`\n    )}\n    <div class=\"cards\">\n      ${arr.map(x=>entityCard(x)).join('')||'<div class=\"panel\"><div class=\"panel-body\"><div class=\"empty\"><strong>Nessun Master subordinato</strong>Puoi crearne uno dal pulsante in alto.</div></div></div>'}\n    </div>`;\n  };\n\n  const originalOpenUserModal=openUserModal;\n  openUserModal=function(role){\n    if(role!=='master'||me().role==='super'){\n      return originalOpenUserModal(role);\n    }\n\n    const parentId=me().id;\n    const html=`<div class=\"modal-backdrop\" id=\"modalBg\">\n      <div class=\"modal\">\n        <div class=\"modal-head\">\n          <h3>Nuovo Master</h3>\n          <button class=\"modal-close\" id=\"modalClose\">×</button>\n        </div>\n        <form id=\"userCreate\">\n          <div class=\"modal-body\">\n            <div class=\"form-grid\">\n              <div class=\"field\"><label>Nome e cognome</label><input id=\"nuName\" required></div>\n              <div class=\"field\"><label>Azienda</label><input id=\"nuCompany\" required></div>\n              <div class=\"field\"><label>Email</label><input id=\"nuEmail\" type=\"email\" required></div>\n              <div class=\"field\"><label>Credito iniziale</label><input id=\"nuBalance\" type=\"number\" min=\"0\" value=\"0\"></div>\n              <div class=\"field full\"><label>Superiore diretto</label><input value=\"${esc(company(me()))}\" disabled></div>\n            </div>\n          </div>\n          <div class=\"modal-foot\">\n            <button type=\"button\" class=\"btn btn-secondary\" id=\"modalCancel\">Annulla</button>\n            <button class=\"btn btn-primary\">Crea account</button>\n          </div>\n        </form>\n      </div>\n    </div>`;\n\n    document.body.insertAdjacentHTML('beforeend',html);\n    const close=()=>document.getElementById('modalBg')?.remove();\n    document.getElementById('modalClose').onclick=close;\n    document.getElementById('modalCancel').onclick=close;\n\n    document.getElementById('userCreate').onsubmit=e=>{\n      e.preventDefault();\n      const id=uid('m');\n\n      state.users.push({\n        id,\n        name:document.getElementById('nuName').value,\n        company:document.getElementById('nuCompany').value,\n        email:document.getElementById('nuEmail').value,\n        password:'demo',\n        role:'master',\n        balance:+document.getElementById('nuBalance').value,\n        parentId,\n        active:true\n      });\n\n      Object.keys(carrierCatalog).forEach(c=>{\n        const base=carrierCatalog[c].base;\n        state.tariffs.push({\n          sellerId:parentId,\n          buyerId:id,\n          carrier:c,\n          price:+(base*1.15).toFixed(2)\n        });\n      });\n\n      save();\n      close();\n      toast('Master creato sotto '+company(me()));\n      render();\n    };\n  };\n\n  document.addEventListener('click',e=>{\n    const b=e.target.closest?.('.ticketForward');\n    if(b){\n      e.preventDefault();\n      forwardTicketToParent(b.dataset.id);\n    }\n  });\n\n  // Migrazione dei ticket già presenti.\n  let changed=false;\n  for(const t of state.tickets||[]){\n    const req=byId(t.requesterId);\n    const sm=superUser();\n\n    if(!Array.isArray(t.routeIds)){\n      t.routeIds=[t.requesterId].filter(Boolean);\n      changed=true;\n    }\n\n    if(!t.currentHolderId&&!['Risolto','Chiuso','Inviato'].includes(t.status)){\n      if(req?.role==='client'){\n        const m=parentOf(req);\n        if(m&&!t.routeIds.includes(m.id))t.routeIds.push(m.id);\n        if(sm&&!t.routeIds.includes(sm.id))t.routeIds.push(sm.id);\n        t.currentHolderId=sm?.id||null;\n        t.status=sm?'In attesa Super Master':'Da assegnare';\n      }else if(req?.role==='master'){\n        const p=parentOf(req);\n        if(p&&!t.routeIds.includes(p.id))t.routeIds.push(p.id);\n        t.currentHolderId=p?.id||null;\n        t.status=nextStatusFor(p);\n      }else if(req?.role==='super'){\n        t.currentHolderId=req.id;\n        t.status='Pronto per invio';\n      }\n      changed=true;\n    }\n  }\n\n  if(changed)save();\n\n  const oldLoginPage=loginPage;\n  loginPage=function(){\n    return oldLoginPage().replace('Versione 0.8.3','Versione 0.8.5');\n  };\n\n  document.title='APS Corriere Platform v0.8.5';\n\n\n  // v0.8.5 — gerarchia invisibile nell'interfaccia ticket.\n  // Il routing continua a funzionare internamente, ma Cliente e Master vedono solo\n  // dati e stato neutro della richiesta.\n  const hierarchyTicketRowHtml = ticketRowHtml;\n  const hierarchyTicketsPage = ticketsPage;\n\n  function neutralTicketStatus(t){\n    if(['Risolto','Chiuso','Inviato'].includes(t.status)) return t.status;\n    return me().role==='super' ? 'Da gestire' : 'Aperto';\n  }\n\n  function neutralTicketHistory(t){\n    return (t.history||[]).filter(h=>{\n      const txt=String(h.text||'');\n      return !/(ricevuto|inoltrat|superiore|gerarchia|Super Master)/i.test(txt);\n    });\n  }\n\n  ticketRowHtml=function(t){\n    const s=t.shipmentId?state.shipments.find(x=>x.id===t.shipmentId):null;\n    const client=byId(t.clientId);\n    const u=me();\n    const visibleStatus=neutralTicketStatus(t);\n\n    const canForward=\n      u.role==='master' &&\n      t.currentHolderId===u.id &&\n      !['Risolto','Chiuso','Inviato'].includes(t.status);\n\n    const canSend=\n      u.role==='super' &&\n      (!t.currentHolderId||t.currentHolderId===u.id) &&\n      !['Risolto','Chiuso','Inviato'].includes(t.status);\n\n    const hist=neutralTicketHistory(t);\n\n    return `<div class=\"ticket-card\">\n      <div class=\"ticket-card-head\">\n        <div>\n          <h4>${esc(t.subject||('Ticket '+t.id))}</h4>\n          <p>${esc(t.message||'Nessun messaggio')}</p>\n        </div>\n        <span class=\"ticket-chip ${ticketStatusClass(t.status)}\">${esc(visibleStatus)}</span>\n      </div>\n\n      <div class=\"ticket-meta\">\n        ${t.ldv?`<span class=\"ticket-chip info\">LDV: ${esc(t.ldv)}</span>`:''}\n        ${s?`<span class=\"ticket-chip\">${esc(s.id)} · ${esc(s.tracking)}</span>`:''}\n        ${client&&u.role!=='client'?`<span class=\"ticket-chip\">Cliente: ${esc(company(client))}</span>`:''}\n        ${t.content?`<span class=\"ticket-chip\">Contenuto: ${esc(t.content)}</span>`:''}\n        ${t.packaging?`<span class=\"ticket-chip\">Imballaggio: ${esc(t.packaging)}</span>`:''}\n      </div>\n\n      ${ticketAttachmentNames(t).length\n        ? `<div class=\"ticket-meta\">${ticketAttachmentNames(t).map(a=>`<span class=\"ticket-chip\">📎 ${esc(a.name)}</span>`).join('')}</div>`\n        : ''}\n\n      ${hist.length?`<div class=\"ticket-history\">\n        ${hist.slice(-8).map(h=>`<div class=\"ticket-history-row\">\n          <div class=\"ticket-history-dot\"></div>\n          <div>\n            <strong>${esc(h.actor)}</strong>\n            <span>${esc(h.text)} · ${esc(new Date(h.at).toLocaleString('it-IT'))}</span>\n          </div>\n        </div>`).join('')}\n      </div>`:''}\n\n      <div class=\"entity-actions\">\n        ${canForward?`<button class=\"btn btn-primary ticketForward\" data-id=\"${t.id}\">Invia ticket</button>`:''}\n        ${canSend?`<button class=\"btn btn-primary ticketSend\" data-id=\"${t.id}\">Invia segnalazione</button>`:''}\n        ${u.role==='super'&&t.status!=='Risolto'\n          ? `<button class=\"btn btn-secondary ticketResolve\" data-id=\"${t.id}\">Segna risolto</button>`\n          : ''}\n        ${t.externalTicketId?`<span class=\"tag blue\">ID ${esc(t.externalTicketId)}</span>`:''}\n      </div>\n    </div>`;\n  };\n\n  ticketsPage=function(){\n    return hierarchyTicketsPage()\n      .replace('Apri un ticket e segui il passaggio nella tua gerarchia.','Apri un ticket e segui lo stato della richiesta.')\n      .replace('Gestione dei ticket arrivati al tuo livello.','Gestione delle richieste di assistenza.')\n      .replace('In attesa livello superiore','In gestione')\n      .replace('Nella gerarchia','Richieste attive')\n      .replace('Flusso ticket APS','Assistenza ticket')\n      .replace('Cliente o Master apre il ticket','Apri il ticket')\n      .replace('Il ticket segue il superiore previsto dalla gerarchia','La richiesta viene presa in carico')\n      .replace('Il Super Master riceve la richiesta','Segui lo stato della richiesta')\n      .replace(\"Solo il Super Master effettua l'invio finale\",'La gestione prosegue internamente');\n  };\n\n  // Messaggi neutri: nessuna indicazione sul percorso gerarchico.\n  const hierarchyForwardTicketToParent = window.forwardTicketToParent;\n  window.forwardTicketToParent=function(id){\n    const t=(state.tickets||[]).find(x=>x.id===id);\n    const u=me();\n    if(!t||u.role!=='master'||t.currentHolderId!==u.id){\n      toast('Ticket non disponibile per l’invio','error');\n      return;\n    }\n    const p=parentOf(u);\n    if(!p){\n      toast('Impossibile inviare il ticket','error');\n      return;\n    }\n    if(!Array.isArray(t.routeIds))t.routeIds=[];\n    if(!t.routeIds.includes(p.id))t.routeIds.push(p.id);\n    t.currentHolderId=p.id;\n    t.status=nextStatusFor(p);\n    ticketHistoryPush(t,company(u),'Ticket inoltrato','inoltro');\n    save();\n    toast('Ticket inviato');\n    render();\n  };\n\n  const hierarchySendTicketExternally = sendTicketExternally;\n  sendTicketExternally=async function(t){\n    const sm=superUser();\n    if(me().role!=='super'||(t.currentHolderId&&t.currentHolderId!==sm?.id)){\n      toast('Ticket non disponibile per l’invio finale','error');\n      return false;\n    }\n    return hierarchySendTicketExternally(t);\n  };\n\n  // Ridisegno finale con interfaccia ticket neutra.\n  render();\n})();";
