function loadState(){
  const saved=localStorage.getItem('aps_state_v1');
  if(!saved){localStorage.setItem('aps_state_v1',JSON.stringify(seed));return structuredClone(seed)}
  const data=JSON.parse(saved);
  ['pickups','holds','providers','tariffs'].forEach(k=>{if(!Array.isArray(data[k])) data[k]=structuredClone(seed[k])});
  data.users=(data.users||[]).map(u=>({...u,active:u.active!==false}));
  data.shipments=(data.shipments||[]).map(s=>{const providerCost=Number(s.providerCost??s.cost??0);const clientPrice=Number(s.clientPrice??s.price??0);const masterCost=Number(s.masterCost??(providerCost+(clientPrice-providerCost)*.42));return {...s,providerCost:+providerCost.toFixed(2),masterCost:+masterCost.toFixed(2),clientPrice:+clientPrice.toFixed(2),cost:+providerCost.toFixed(2),price:+clientPrice.toFixed(2)}});
  return data;
}
function save(){localStorage.setItem('aps_state_v1',JSON.stringify(state));}
function me(){return state.users.find(u=>u.id===session?.userId)}
function roleLabel(r){return r==='super'?'Super Master':r==='master'?'Master':'Cliente'}
function childrenOf(id){return state.users.filter(u=>u.parentId===id)}
function descendants(user){
  if(user.role==='client') return [user.id];
  if(user.role==='master') return [user.id,...childrenOf(user.id).map(x=>x.id)];
  return state.users.map(u=>u.id);
}
function visibleShipments(user=me()){
  if(user.role==='super') return state.shipments;
  if(user.role==='master') return state.shipments.filter(s=>s.masterId===user.id);
  return state.shipments.filter(s=>s.ownerId===user.id);
}
function visibleClients(user=me()){
  if(user.role==='super') return state.users.filter(u=>u.role==='client');
  if(user.role==='master') return state.users.filter(u=>u.role==='client'&&u.parentId===user.id);
  return [];
}
function visibleMasters(){return state.users.filter(u=>u.role==='master')}
function tariffRecord(sellerId,buyerId,carrier){return (state.tariffs||[]).find(t=>t.sellerId===sellerId&&t.buyerId===buyerId&&t.carrier===carrier)}
function tariffPrice(sellerId,buyerId,carrier,fallback){return Number(tariffRecord(sellerId,buyerId,carrier)?.price??fallback)}
function shipmentEconomics(s,user=me()){
  const provider=Number(s.providerCost??s.cost??0), master=Number(s.masterCost??provider), client=Number(s.clientPrice??s.price??0);
  if(user.role==='super') return {sale:master,cost:provider,margin:master-provider};
  if(user.role==='master') return {sale:client,cost:master,margin:client-master};
  return {sale:client,cost:client,margin:0};
}
function economicTotals(user=me()){return visibleShipments(user).reduce((a,s)=>{const e=shipmentEconomics(s,user);a.sale+=e.sale;a.cost+=e.cost;a.margin+=e.margin;return a},{sale:0,cost:0,margin:0})}

function bindCommon(){
 document.querySelectorAll('[data-login]').forEach(b=>b.onclick=()=>loginAs(b.dataset.login));
 const lf=document.getElementById('loginForm'); if(lf) lf.onsubmit=e=>{e.preventDefault();const u=state.users.find(x=>x.email===loginEmail.value.trim()&&x.password===loginPassword.value);u&&u.active!==false?loginAs(u.id):toast('Credenziali non valide o account sospeso','error')};
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{currentView=b.dataset.view;render()});
 document.getElementById('logoutBtn')?.addEventListener('click',()=>{localStorage.removeItem('aps_session');session=null;currentView='dashboard';render()});
 document.getElementById('mobileMenu')?.addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
 bindPage();
}
function loginAs(id){const u=state.users.find(x=>x.id===id);if(!u||u.active===false){toast('Account sospeso','error');return}session={userId:id};localStorage.setItem('aps_session',JSON.stringify(session));currentView='dashboard';render()}

function bindPage(){
 if(currentView==='shipments') bindShipmentFilters();
 if(currentView==='new') bindQuote();
 if(currentView==='masters') document.getElementById('addMasterBtn')?.addEventListener('click',()=>openUserModal('master'));
 if(currentView==='clients') document.getElementById('addClientBtn')?.addEventListener('click',()=>openUserModal('client'));
 if(currentView==='tariffs') bindTariffs();
 if(currentView==='credit') {document.getElementById('rechargeBtn')?.addEventListener('click',rechargeDemo);document.getElementById('creditManageBtn')?.addEventListener('click',openCreditModal)}
 if(currentView==='pickups') document.getElementById('addPickupBtn')?.addEventListener('click',openPickupModal);
 if(currentView==='holds') document.querySelectorAll('.holdAction').forEach(b=>b.addEventListener('click',()=>manageHold(b.dataset.id,b.dataset.action)));
 if(currentView==='providers') document.querySelectorAll('.providerToggle').forEach(b=>b.addEventListener('click',()=>toggleProvider(b.dataset.id)));
 if(currentView==='users') document.querySelectorAll('.userToggle').forEach(b=>b.addEventListener('click',()=>toggleUser(b.dataset.id)));
 if(currentView==='tracking') document.getElementById('trackingBtn')?.addEventListener('click',doTracking);
 if(currentView==='reports') document.getElementById('exportCsv')?.addEventListener('click',exportCSV);
 if(currentView==='economics') document.getElementById('exportEconomicCsv')?.addEventListener('click',exportEconomicCSV);
 if(currentView==='settings') document.getElementById('settingsForm')?.addEventListener('submit',saveSettings);
}
function bindShipmentFilters(){const base=visibleShipments();const update=()=>{const q=(document.getElementById('shipSearch').value||'').toLowerCase(),s=document.getElementById('shipStatus').value;const rows=base.filter(x=>(!s||x.status===s)&&(!q||[x.id,x.recipient,x.tracking,x.city,x.carrier].join(' ').toLowerCase().includes(q)));document.getElementById('shipTableWrap').innerHTML=shipTable(rows)};document.getElementById('shipSearch').oninput=update;document.getElementById('shipStatus').onchange=update}
function bindTariffs(){
 document.getElementById('tariffBuyer')?.addEventListener('change',e=>{selectedTariffBuyer=e.target.value;render()});
 document.getElementById('saveTariffs')?.addEventListener('click',()=>{
   const u=me(),buyer=state.users.find(x=>x.id===selectedTariffBuyer);if(!buyer)return;
   const inputs=[...document.querySelectorAll('.tariffInput')];
   for(const inp of inputs){const price=Number(inp.value),cost=Number(inp.dataset.cost);if(!Number.isFinite(price)||price<cost){toast(`Il prezzo ${inp.dataset.carrier} non può essere sotto costo`,'error');return}}
   inputs.forEach(inp=>{const carrier=inp.dataset.carrier,price=+Number(inp.value).toFixed(2);let rec=tariffRecord(u.id,buyer.id,carrier);if(rec)rec.price=price;else state.tariffs.push({sellerId:u.id,buyerId:buyer.id,carrier,price})});
   save();toast('Listino salvato per '+buyer.company);render();
 });
}
function quoteEconomics(owner,carrier,weight,cod,insurance){
 const meta=carrierCatalog[carrier],providerCost=+(meta.base+weight*.46*meta.coef+(cod>0?1.1:0)+insurance).toFixed(2);
 const master=state.users.find(x=>x.id===owner.parentId);
 const masterBase=tariffPrice('u-sm',master?.id,carrier,meta.base*1.15);
 const clientBase=tariffPrice(master?.id,owner.id,carrier,masterBase*1.20);
 const masterCost=+(providerCost+(masterBase-meta.base)).toFixed(2);
 const clientPrice=+(providerCost+(clientBase-meta.base)).toFixed(2);
 return {providerCost,masterCost,clientPrice,superMargin:+(masterCost-providerCost).toFixed(2),masterMargin:+(clientPrice-masterCost).toFixed(2)};
}
function bindQuote(){
 const form=document.getElementById('quoteForm'); if(!form)return;
 const updateWeight=()=>{
   const parcels=Math.max(1,+document.getElementById('qParcels')?.value||1);
   const real=Math.max(.1,+document.getElementById('qWeight')?.value||.1);
   const l=Math.max(1,+document.getElementById('qLength')?.value||1);
   const w=Math.max(1,+document.getElementById('qWidth')?.value||1);
   const h=Math.max(1,+document.getElementById('qHeight')?.value||1);
   const volumetric=+(l*w*h/5000*parcels).toFixed(2);
   const chargeable=Math.max(real,volumetric);
   const info=document.getElementById('weightInfo');
   if(info) info.innerHTML=`Peso reale <strong>${real.toFixed(2)} kg</strong> · volumetrico <strong>${volumetric.toFixed(2)} kg</strong> · tariffabile <strong>${chargeable.toFixed(2)} kg</strong>`;
   return {parcels,real,volumetric,chargeable,l,w,h};
 };
 ['qParcels','qWeight','qLength','qWidth','qHeight'].forEach(id=>document.getElementById(id)?.addEventListener('input',updateWeight));
 updateWeight();

 form.onsubmit=e=>{
   e.preventDefault();
   const weights=updateWeight(),cod=+qCod.value,ins=+qInsurance.value;
   if(!/^\d{5}$/.test(qSenderZip.value.trim())||!/^\d{5}$/.test(qZip.value.trim())){toast('CAP non valido: inserisci 5 cifre','error');return}
   if(qSenderProvince.value.trim().length!==2||qProvince.value.trim().length!==2){toast('Provincia: usa la sigla di 2 lettere','error');return}

   const owner=me().role==='client'?me():state.users.find(x=>x.id===qOwner.value);
   if(!owner){toast('Seleziona un cliente valido','error');return}

   const enabled=new Set((state.providers||[]).filter(p=>p.enabled).map(p=>p.code));
   const carriers=Object.keys(carrierCatalog).filter(c=>enabled.has(c));
   const quotes=carriers
     .map(name=>({name,...quoteEconomics(owner,name,weights.chargeable,cod,ins),chargeableWeight:weights.chargeable,volumetricWeight:weights.volumetric}))
     .map(x=>({...x,cost:x.providerCost,price:x.clientPrice}));

   document.getElementById('quotes').innerHTML=quotes.map((q,i)=>`<div class="quote">
     <div class="carrier-logo">${q.name}</div>
     <div class="details"><strong>${q.name} Standard</strong><span>Consegna stimata 1–2 giorni lavorativi · peso tariffabile ${q.chargeableWeight.toFixed(2)} kg</span>
     ${me().role==='super'?`<span>Margine APS ${money(q.superMargin)} · margine Master ${money(q.masterMargin)}</span>`:me().role==='master'?`<span>Tuo costo ${money(q.masterCost)} · tuo margine ${money(q.masterMargin)}</span>`:''}</div>
     <div class="price"><strong>${money(q.clientPrice)}</strong><span>prezzo Cliente · IVA esclusa</span></div>
     <button class="btn btn-primary chooseQuote" data-i="${i}">Scegli</button>
   </div>`).join('')||'<div class="notice">Nessun provider attivo. Il Super Master deve attivare almeno un corriere.</div>';

   document.querySelectorAll('.chooseQuote').forEach(b=>b.onclick=()=>createShipment(quotes[+b.dataset.i]));
 };
}

function createShipment(q){
 const u=me(),owner=u.role==='client'?u:state.users.find(x=>x.id===document.getElementById('qOwner')?.value);
 if(!owner){toast('Seleziona un cliente valido','error');return}
 if(owner.balance<q.clientPrice){toast('Credito cliente insufficiente','error');return}

 const num='APS'+new Date().getFullYear().toString().slice(2)+String(state.shipments.length+1).padStart(4,'0');
 const master=state.users.find(x=>x.id===owner.parentId);

 const parcels=Math.max(1,+qParcels.value||1);
 const realWeight=Math.max(.1,+qWeight.value||.1);
 const l=Math.max(1,+qLength.value||1),w=Math.max(1,+qWidth.value||1),h=Math.max(1,+qHeight.value||1);
 const volumetricWeight=+(l*w*h/5000*parcels).toFixed(2);
 const chargeableWeight=Math.max(realWeight,volumetricWeight);

 const s={
   id:num,ownerId:owner.id,masterId:master?.id||null,
   sender:{
     name:qSenderName.value.trim(),
     contact:qSenderContact.value.trim(),
     address:qSenderAddress.value.trim(),
     zip:qSenderZip.value.trim(),
     city:qSenderCity.value.trim(),
     province:qSenderProvince.value.trim().toUpperCase(),
     phone:qSenderPhone.value.trim(),
     email:qSenderEmail.value.trim()
   },
   recipient:qRecipient.value.trim(),
   recipientContact:qRecipientContact.value.trim(),
   address:qAddress.value.trim(),
   zip:qZip.value.trim(),
   city:qCity.value.trim(),
   province:qProvince.value.trim().toUpperCase(),
   phone:qPhone.value.trim(),
   email:qEmail.value.trim(),
   parcels,weight:realWeight,length:l,width:w,height:h,volumetricWeight,chargeableWeight,
   content:qContent.value.trim(),
   reference:qReference.value.trim(),
   notes:qNotes.value.trim(),
   goodsValue:+qGoodsValue.value||0,
   carrier:q.name,status:'Presa in carico',
   providerCost:q.providerCost,masterCost:q.masterCost,clientPrice:q.clientPrice,price:q.clientPrice,cost:q.providerCost,
   cod:+qCod.value,
   insurance:+qInsurance.value>0,
   created:new Date().toISOString().slice(0,10),
   tracking:q.name+num,
   events:[{status:'Presa in carico',date:new Date().toISOString().slice(0,10),note:'Spedizione creata sulla piattaforma'}]
 };

 state.shipments.unshift(s);
 owner.balance=+(owner.balance-q.clientPrice).toFixed(2);
 state.transactions.unshift({id:uid('T'),userId:owner.id,type:'Spedizione',amount:-q.clientPrice,date:s.created,note:num});
 if(s.cod>0)state.cod.unshift({id:uid('COD'),clientId:owner.id,amount:s.cod,status:'In attesa',date:s.created,shipment:num});
 save();toast('Spedizione creata: '+num);currentView='shipments';render();
}

function openUserModal(role){const parentOptions=role==='client'&&me().role==='super'?visibleMasters().map(m=>`<option value="${m.id}">${m.company}</option>`).join(''):'';const html=`<div class="modal-backdrop" id="modalBg"><div class="modal"><div class="modal-head"><h3>Nuovo ${roleLabel(role)}</h3><button class="modal-close" id="modalClose">×</button></div><form id="userCreate"><div class="modal-body"><div class="form-grid"><div class="field"><label>Nome e cognome</label><input id="nuName" required></div><div class="field"><label>Azienda</label><input id="nuCompany" required></div><div class="field"><label>Email</label><input id="nuEmail" type="email" required></div><div class="field"><label>Credito iniziale</label><input id="nuBalance" type="number" min="0" value="0"></div>${parentOptions?`<div class="field full"><label>Master di appartenenza</label><select id="nuParent">${parentOptions}</select></div>`:''}</div></div><div class="modal-foot"><button type="button" class="btn btn-secondary" id="modalCancel">Annulla</button><button class="btn btn-primary">Crea account</button></div></form></div></div>`;document.body.insertAdjacentHTML('beforeend',html);const close=()=>document.getElementById('modalBg')?.remove();modalClose.onclick=close;modalCancel.onclick=close;userCreate.onsubmit=e=>{e.preventDefault();const id=uid(role==='master'?'m':'c');const parentId=role==='master'?'u-sm':me().role==='master'?me().id:nuParent.value;state.users.push({id,name:nuName.value,company:nuCompany.value,email:nuEmail.value,password:'demo',role,balance:+nuBalance.value,parentId,active:true});Object.keys(carrierCatalog).forEach(c=>{const base=carrierCatalog[c].base;if(role==='master')state.tariffs.push({sellerId:'u-sm',buyerId:id,carrier:c,price:+(base*1.15).toFixed(2)});else{const masterCost=tariffPrice('u-sm',parentId,c,base*1.15);state.tariffs.push({sellerId:parentId,buyerId:id,carrier:c,price:+(masterCost*1.20).toFixed(2)})}});save();close();toast(roleLabel(role)+' creato');render()}}
function openCreditModal(){const u=me();const targets=u.role==='super'?visibleMasters():visibleClients(u);if(!targets.length){toast('Non ci sono destinatari disponibili','error');return}const html=`<div class="modal-backdrop" id="modalBg"><div class="modal"><div class="modal-head"><h3>Trasferisci credito</h3><button class="modal-close" id="modalClose">×</button></div><form id="creditTransfer"><div class="modal-body"><div class="field"><label>Destinatario</label><select id="creditTarget">${targets.map(x=>`<option value="${x.id}">${x.company} · saldo ${money(x.balance)}</option>`).join('')}</select></div><div class="field"><label>Importo (€)</label><input id="creditAmount" type="number" min="1" step="0.01" required></div><div class="notice">Saldo disponibile: <strong>${money(u.balance)}</strong></div></div><div class="modal-foot"><button type="button" class="btn btn-secondary" id="modalCancel">Annulla</button><button class="btn btn-primary">Conferma trasferimento</button></div></form></div></div>`;document.body.insertAdjacentHTML('beforeend',html);const close=()=>document.getElementById('modalBg')?.remove();modalClose.onclick=close;modalCancel.onclick=close;creditTransfer.onsubmit=e=>{e.preventDefault();const amount=+creditAmount.value,target=state.users.find(x=>x.id===creditTarget.value);if(!target||amount<=0)return;if(u.balance<amount){toast('Credito insufficiente','error');return}u.balance=+(u.balance-amount).toFixed(2);target.balance=+(target.balance+amount).toFixed(2);const d=new Date().toISOString().slice(0,10);state.transactions.unshift({id:uid('T'),userId:u.id,type:'Trasferimento credito',amount:-amount,date:d,note:'A '+target.company});state.transactions.unshift({id:uid('T'),userId:target.id,type:'Credito ricevuto',amount:amount,date:d,note:'Da '+u.company});save();close();toast('Credito trasferito a '+target.company);render()}}

function openPickupModal(){const u=me();const targets=u.role==='client'?[u]:visibleClients(u);if(!targets.length){toast('Crea prima un cliente','error');return}const tomorrow=new Date(Date.now()+86400000).toISOString().slice(0,10);const html=`<div class="modal-backdrop" id="modalBg"><div class="modal"><div class="modal-head"><h3>Programma ritiro</h3><button class="modal-close" id="modalClose">×</button></div><form id="pickupCreate"><div class="modal-body"><div class="form-grid">${u.role==='client'?'':`<div class="field full"><label>Cliente</label><select id="pickupClient">${targets.map(x=>`<option value="${x.id}">${x.company}</option>`).join('')}</select></div>`}<div class="field"><label>Data</label><input id="pickupDate" type="date" min="${tomorrow}" value="${tomorrow}" required></div><div class="field"><label>Fascia</label><select id="pickupSlot"><option>09:00–13:00</option><option>14:00–18:00</option></select></div><div class="field"><label>Colli</label><input id="pickupParcels" type="number" min="1" value="1" required></div><div class="field"><label>Città</label><input id="pickupCity" required></div><div class="field full"><label>Indirizzo ritiro</label><input id="pickupAddress" required></div></div></div><div class="modal-foot"><button type="button" class="btn btn-secondary" id="modalCancel">Annulla</button><button class="btn btn-primary">Programma</button></div></form></div></div>`;document.body.insertAdjacentHTML('beforeend',html);const close=()=>document.getElementById('modalBg')?.remove();modalClose.onclick=close;modalCancel.onclick=close;pickupCreate.onsubmit=e=>{e.preventDefault();const client=u.role==='client'?u.id:pickupClient.value;state.pickups.unshift({id:'RIT'+String(state.pickups.length+1).padStart(3,'0'),clientId:client,date:pickupDate.value,slot:pickupSlot.value,address:pickupAddress.value,city:pickupCity.value,parcels:+pickupParcels.value,status:'Richiesto'});save();close();toast('Ritiro programmato');render()}}

function manageHold(id,action){const h=state.holds.find(x=>x.id===id);if(!h)return;h.action=action;h.status='Richiesta inviata';save();toast(action+' richiesta');render()}
function toggleProvider(id){const p=state.providers.find(x=>x.id===id);if(!p)return;p.enabled=!p.enabled;p.status=p.enabled?'Online':'Disattivo';save();toast(p.name+' '+(p.enabled?'attivato':'disattivato'));render()}
function toggleUser(id){const u=state.users.find(x=>x.id===id);if(!u||u.role==='super')return;u.active=u.active===false;save();toast(u.company+' '+(u.active?'riattivato':'sospeso'));render()}

function rechargeDemo(){const u=me();u.balance=+(u.balance+100).toFixed(2);state.transactions.unshift({id:uid('T'),userId:u.id,type:'Ricarica',amount:100,date:new Date().toISOString().slice(0,10),note:'Ricarica demo'});save();toast('Ricarica demo di €100 effettuata');render()}
function doTracking(){
 const q=trackingInput.value.trim().toLowerCase();
 const s=visibleShipments().find(x=>x.id.toLowerCase()===q||x.tracking.toLowerCase()===q);
 const r=document.getElementById('trackingResult');
 if(!s){r.innerHTML=`<div class="notice" style="margin-top:16px">Spedizione non trovata nel tuo perimetro.</div>`;return}
 r.innerHTML=`<div style="margin-top:22px"><div class="entity-card">
   <div class="entity-top"><div class="carrier-logo">${esc(s.carrier)}</div><div><h4>${esc(s.id)}</h4><p>${esc(s.recipient)} · ${esc(s.city)} · ${esc(s.tracking)}</p></div></div>
   <div class="action-stack" style="margin-top:14px"><span class="status ${statusClass(s.status)}">${esc(s.status)}</span><button class="btn btn-secondary" onclick="openShipmentDetail('${esc(s.id)}')">Apri dettagli</button><button class="btn btn-secondary" onclick="printShippingLabel('${esc(s.id)}')">Stampa etichetta / PDF</button></div>
   <div style="margin-top:20px">${eventTimelineHtml(s)}</div>
   ${s.status==='Giacenza'?'<div class="notice">La spedizione risulta in giacenza. Usa la sezione “Giacenze e resi” per gestirla.</div>':''}
 </div></div>`;
}
function exportCSV(){const rows=visibleShipments();const csv=['Numero,Destinatario,Indirizzo,CAP,Citta,Provincia,Telefono,Email,Colli,PesoReale,PesoVolumetrico,PesoTariffabile,Contenuto,Riferimento,Corriere,Stato,Prezzo,Costo,Tracking',...rows.map(s=>[s.id,s.recipient,s.address||'',s.zip||'',s.city,s.province||'',s.phone||'',s.email||'',s.parcels||1,s.weight||'',s.volumetricWeight||'',s.chargeableWeight||s.weight||'',s.content||'',s.reference||'',s.carrier,s.status,s.price,s.cost,s.tracking].map(v=>`"${String(v).replaceAll('"','""')}"`).join(','))].join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='aps-corriere-spedizioni.csv';a.click();URL.revokeObjectURL(url);toast('CSV esportato')}
function exportEconomicCSV(){const u=me(),rows=visibleShipments(u);const csv=['Spedizione,Data,Cliente,Corriere,Vendita,Costo,Margine',...rows.map(s=>{const e=shipmentEconomics(s,u),cl=state.users.find(x=>x.id===s.ownerId);return [s.id,s.created,cl?.company||'',s.carrier,e.sale,e.cost,e.margin].map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')})].join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='aps-corriere-margini.csv';a.click();URL.revokeObjectURL(url);toast('Report margini esportato')}
function saveSettings(e){e.preventDefault();state.settings.brand=setBrand.value;state.settings.email=setEmail.value;state.settings.primary=setColor.value;save();document.documentElement.style.setProperty('--brand',setColor.value);toast('Impostazioni salvate')}

render();
