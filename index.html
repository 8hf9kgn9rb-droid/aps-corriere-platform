<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>APS Corriere Platform</title>
</head>

<body>
  <div id="avvio" style="
    min-height:100vh;
    display:grid;
    place-items:center;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
  ">
    <div style="
      background:white;
      padding:35px;
      border-radius:18px;
      text-align:center;
      box-shadow:0 10px 35px rgba(0,0,0,.08);
    ">
      <h2>APS Corriere</h2>
      <p>Caricamento piattaforma...</p>
    </div>
  </div>

<script>
(async function () {
  try {

    const risposta = await fetch(
      "./index-v086.html?fix=" + Date.now(),
      { cache: "no-store" }
    );

    if (!risposta.ok) {
      throw new Error("Errore caricamento: " + risposta.status);
    }

    let pagina = await risposta.text();

    pagina = pagina.replace(
      "./index%20%286%29.html?v=083",
      "./index-v08.html?v=080"
    );

    document.open();
    document.write(pagina);
    document.close();

  } catch (errore) {

    console.error(errore);

    document.getElementById("avvio").innerHTML = `
      <div style="
        background:white;
        padding:35px;
        border-radius:18px;
        text-align:center;
        box-shadow:0 10px 35px rgba(0,0,0,.08);
      ">
        <h2>APS Corriere</h2>
        <p>Errore durante l'avvio della piattaforma.</p>
        <button onclick="location.reload()"
          style="
            padding:12px 20px;
            border:0;
            border-radius:10px;
            background:#155eef;
            color:white;
            font-weight:bold;
            cursor:pointer;
          ">
          Ricarica
        </button>
      </div>
    `;
  }
})();
</script>

</body>
</html>
