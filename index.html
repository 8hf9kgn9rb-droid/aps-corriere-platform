.login-copy{position:relative;max-width:650px}.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:#7ea6ff}.login-copy h1{font-size:55px;line-height:1.02;margin:16px 0 18px;letter-spacing:-.04em}.login-copy p{font-size:18px;line-height:1.7;color:#c9d8f8;max-width:580px}.hierarchy{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:28px}.hierarchy span{padding:10px 14px;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:rgba(255,255,255,.08);font-size:13px;font-weight:700}.hierarchy b{color:#7ea6ff}
.login-foot{position:relative;color:#8ca7db;font-size:12px}
.login-panel{display:grid;place-items:center;padding:34px}.login-card{width:min(520px,100%);background:white;border:1px solid #e7ebf0;border-radius:26px;padding:34px;box-shadow:var(--shadow)}.login-card h2{margin:0;font-size:28px}.login-card>p{margin:10px 0 26px;color:var(--muted);line-height:1.6}.demo-grid{display:grid;gap:12px}.demo-role{width:100%;display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:15px;background:white;text-align:left;transition:.2s}.demo-role:hover{border-color:#a9c2ff;transform:translateY(-1px);box-shadow:0 8px 24px rgba(21,94,239,.08)}.role-badge{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:900;background:var(--brandSoft);color:var(--brand)}.demo-role strong{display:block;margin-bottom:4px}.demo-role small{color:var(--muted)}.demo-role .arrow{margin-left:auto;font-size:20px;color:#9aa4b2}

.content{padding:28px;max-width:1600px;margin:auto}.page-head{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;margin-bottom:22px}.page-head h1{margin:0;font-size:28px;letter-spacing:-.03em}.page-head p{margin:7px 0 0;color:var(--muted);font-size:13px}.head-actions{display:flex;gap:10px;flex-wrap:wrap}
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 3px 10px rgba(18,31,53,.03)}.kpi-top{display:flex;align-items:center;justify-content:space-between}.kpi-label{font-size:12px;color:var(--muted);font-weight:600}.kpi-icon{width:36px;height:36px;border-radius:11px;background:var(--brandSoft);display:grid;place-items:center;color:var(--brand);font-weight:900}.kpi-value{font-size:27px;font-weight:800;margin:13px 0 7px;letter-spacing:-.03em}.kpi-foot{font-size:11px;color:var(--ok);font-weight:700}.kpi-foot.muted{color:var(--muted)}
.grid-2{display:grid;grid-template-columns:1.35fr .65fr;gap:18px}.grid-2-equal{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 3px 10px rgba(18,31,53,.03);overflow:hidden}.panel-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head h3{margin:0;font-size:14px}.panel-body{padding:18px 20px}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;min-width:700px}.data-table th{text-align:left;padding:12px 13px;color:#7a8493;font-size:10px;text-transform:uppercase;letter-spacing:.06em;background:#fbfcfe;border-bottom:1px solid var(--line)}.data-table td{padding:13px;border-bottom:1px solid #eef1f5;font-size:12px}.data-table tr:last-child td{border-bottom:0}.data-table tr:hover td{background:#fbfcff}.status{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:800}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.status.ok{background:var(--okSoft);color:var(--ok)}.status.warn{background:var(--warnSoft);color:var(--warn)}.status.info{background:var(--brandSoft);color:var(--brand)}.status.danger{background:var(--dangerSoft);color:var(--danger)}
.list{display:grid;gap:10px}.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eef1f5}.list-row:last-child{border-bottom:0}.circle{width:37px;height:37px;border-radius:12px;background:#eef3ff;color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:12px}.grow{flex:1;min-width:0}.grow strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grow span{font-size:10px;color:var(--muted)}.money{font-size:12px;font-weight:800}.positive{color:var(--ok)}.negative{color:var(--danger)}
.chart{height:185px;display:flex;align-items:flex-end;gap:9px;padding-top:15px}.bar-wrap{flex:1;text-align:center}.bar{border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#5d8fff,#155eef);min-height:14px;position:relative}.bar-wrap span{display:block;color:#8a94a3;font-size:9px;margin-top:7px}.bar:hover:after{content:attr(data-value);position:absolute;left:50%;transform:translateX(-50%);top:-28px;background:#111827;color:white;border-radius:6px;padding:4px 6px;font-size:9px;white-space:nowrap}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:white}.toolbar input{min-width:260px;flex:1}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.entity-card{background:white;border:1px solid var(--line);border-radius:16px;padding:17px}.entity-top{display:flex;gap:12px;align-items:center}.entity-card h4{margin:0 0 4px;font-size:14px}.entity-card p{margin:0;color:var(--muted);font-size:11px}.entity-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.meta-box{background:#f8fafc;border-radius:10px;padding:10px}.meta-box span{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.meta-box strong{font-size:12px}.entity-actions{display:flex;gap:8px;margin-top:14px}

.timeline{display:grid;gap:0;margin:10px 0}.timeline-step{display:grid;grid-template-columns:26px 1fr;gap:10px;position:relative;padding-bottom:18px}.timeline-step:not(:last-child):before{content:"";position:absolute;left:12px;top:22px;bottom:0;width:2px;background:#e3e8f0}.dot{width:26px;height:26px;border-radius:50%;background:#e8eef7;color:#7c8aa0;display:grid;place-items:center;font-size:10px;font-weight:900;z-index:1}.timeline-step.done .dot{background:var(--ok);color:white}.timeline-step.current .dot{background:var(--brand);color:white}.timeline-step strong{font-size:12px}.timeline-step p{margin:3px 0 0;color:var(--muted);font-size:10px}

.notice{border:1px solid #cfe0ff;background:#f3f7ff;border-radius:13px;padding:13px 15px;font-size:12px;color:#36517f;margin-bottom:16px}.empty{padding:48px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);margin-bottom:6px}.tag{display:inline-flex;padding:5px 8px;border-radius:8px;background:#eef2f7;color:#526071;font-size:10px;font-weight:700}.tag.blue{background:var(--brandSoft);color:var(--brand)}

.modal-backdrop{position:fixed;inset:0;background:rgba(15,29,55,.45);z-index:50;display:grid;place-items:center;padding:20px}.modal{width:min(640px,100%);max-height:90vh;overflow:auto;background:white;border-radius:20px;box-shadow:0 25px 80px rgba(15,29,55,.25)}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-head h3{margin:0}.modal-close{border:0;background:#f3f5f8;width:32px;height:32px;border-radius:9px}.modal-body{padding:20px}.modal-foot{padding:16px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.toast{position:fixed;right:24px;bottom:24px;background:#102342;color:white;padding:13px 16px;border-radius:12px;font-size:12px;font-weight:700;box-shadow:0 15px 45px rgba(0,0,0,.2);z-index:80;animation:slidein .2s ease}.toast.ok{background:#126a4a}.toast.error{background:#a62e2e}@keyframes slidein{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

@media (max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.grid-2,.grid-2-equal{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}
@media (max-width:780px){.login-shell{grid-template-columns:1fr}.login-brand{padding:34px;min-height:380px}.login-copy h1{font-size:38px}.login-panel{padding:20px}.app-shell{grid-template-columns:1fr}.sidebar{position:fixed;left:-265px;z-index:40;width:250px;transition:.25s}.sidebar.open{left:0}.mobile-menu{display:block}.content{padding:19px}.topbar{padding:0 15px}.top-search{display:none}.kpi-grid{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.page-head{flex-direction:column}.login-foot{margin-top:30px}}

</style>

let state = loadState();
let session = JSON.parse(localStorage.getItem('aps_session')||'null');
let currentView='dashboard';

function loadState(){
  const saved=localStorage.getItem('aps_state_v1');
  if(saved) return JSON.parse(saved);
  localStorage.setItem('aps_state_v1',JSON.stringify(seed));
  return structuredClone(seed);
}
function save(){localStorage.setItem('aps_state_v1',JSON.stringify(state));}
function me(){return state.users.find(u=>u.id===session?.userId)}
function roleLabel(r){return r==='super'?'Super Master':r==='master'?'Master':'Cliente'}
function childrenOf(id){return state.users.filter(u=>u.parentId===id)}
function descendants(user){
  if(user.role==='client') return [user.id];
  if(user.role==='master') return [user.id,...childrenOf(user.id).map(x=>x.id)];
  return state.users.map(u=>u.id);
}
function visibleShipments(user=me()){
  if(user.role==='super') return state.shipments;
  if(user.role==='master') return state.shipments.filter(s=>s.masterId===user.id);
  return state.shipments.filter(s=>s.ownerId===user.id);
}
function visibleClients(user=me()){
  if(user.role==='super') return state.users.filter(u=>u.role==='client');
  if(user.role==='master') return state.users.filter(u=>u.role==='client'&&u.parentId===user.id);
  return [];
}
function visibleMasters(){return state.users.filter(u=>u.role==='master')}
function initials(n=''){return n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function statusClass(s){if(['Consegnata','Incassato','Pagato'].includes(s))return'ok';if(['Giacenza','In attesa','Anomalia'].includes(s))return'warn';if(['Annullata'].includes(s))return'danger';return'info'}
function toast(msg,type='ok'){const x=document.createElement('div');x.className='toast '+type;x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),2600)}

function render(){document.getElementById('app').innerHTML=session?appShell():loginPage();bindCommon();}

function bindCommon(){
 document.querySelectorAll('[data-login]').forEach(b=>b.onclick=()=>loginAs(b.dataset.login));
 const lf=document.getElementById('loginForm'); if(lf) lf.onsubmit=e=>{e.preventDefault();const u=state.users.find(x=>x.email===loginEmail.value.trim()&&x.password===loginPassword.value);u?loginAs(u.id):toast('Credenziali non valide','error')};

function loginAs(id){session={userId:id};localStorage.setItem('aps_session',JSON.stringify(session));currentView='dashboard';render()}

function bindPage(){
 if(currentView==='shipments') bindShipmentFilters();
 if(currentView==='new') bindQuote();
 if(currentView==='masters') document.getElementById('addMasterBtn')?.addEventListener('click',()=>openUserModal('master'));
 if(currentView==='clients') document.getElementById('addClientBtn')?.addEventListener('click',()=>openUserModal('client'));
 if(currentView==='tariffs') document.getElementById('saveTariffs')?.addEventListener('click',()=>toast('Listino demo salvato'));
 if(currentView==='credit') document.getElementById('rechargeBtn')?.addEventListener('click',rechargeDemo);
 if(currentView==='tracking') document.getElementById('trackingBtn')?.addEventListener('click',doTracking);
 if(currentView==='reports') document.getElementById('exportCsv')?.addEventListener('click',exportCSV);
 if(currentView==='settings') document.getElementById('settingsForm')?.addEventListener('submit',saveSettings);
}
function bindShipmentFilters(){const base=visibleShipments();const update=()=>{const q=(document.getElementById('shipSearch').value||'').toLowerCase(),s=document.getElementById('shipStatus').value;const rows=base.filter(x=>(!s||x.status===s)&&(!q||[x.id,x.recipient,x.tracking,x.city,x.carrier].join(' ').toLowerCase().includes(q)));document.getElementById('shipTableWrap').innerHTML=shipTable(rows)};document.getElementById('shipSearch').oninput=update;document.getElementById('shipStatus').onchange=update}
function bindQuote(){document.getElementById('quoteForm').onsubmit=e=>{e.preventDefault();const w=+qWeight.value,cod=+qCod.value,ins=+qInsurance.value;const carriers=[['GLS',4.9,1],['BRT',5.1,.95],['SDA',5.3,1.05],['UPS',6.8,.9]];const multiplier=me().role==='client'?1.36:me().role==='master'?1.18:1.05;const quotes=carriers.map(([name,base,coef])=>({name,cost:+(base+w*.46*coef+(cod>0?1.1:0)+ins).toFixed(2)})).map(x=>({...x,price:+(x.cost*multiplier).toFixed(2)}));document.getElementById('quotes').innerHTML=quotes.map((q,i)=>`<div class="quote"><div class="carrier-logo">${q.name}</div><div class="details"><strong>${q.name} Standard</strong><span>Consegna stimata 1–2 giorni lavorativi</span></div>${me().role!=='client'?`<div class="small muted">Costo ${money(q.cost)}</div>`:''}<div class="price"><strong>${money(q.price)}</strong><span>IVA esclusa</span></div><button class="btn btn-primary chooseQuote" data-i="${i}">Scegli</button></div>`).join('');document.querySelectorAll('.chooseQuote').forEach(b=>b.onclick=()=>createShipment(quotes[+b.dataset.i]))}}
function createShipment(q){const u=me();const owner=u.role==='client'?u:visibleClients(u)[0];if(!owner){toast('Crea prima almeno un cliente nella tua rete','error');return}if(owner.balance<q.price){toast('Credito cliente insufficiente','error');return}const num='APS'+new Date().getFullYear().toString().slice(2)+String(state.shipments.length+1).padStart(4,'0');const master=owner.role==='client'?state.users.find(x=>x.id===owner.parentId):null;const s={id:num,ownerId:owner.id,masterId:master?.id||null,recipient:qRecipient.value,city:qCity.value,carrier:q.name,status:'Presa in carico',price:q.price,cost:q.cost,cod:+qCod.value,created:new Date().toISOString().slice(0,10),tracking:q.name+num};state.shipments.unshift(s);owner.balance=+(owner.balance-q.price).toFixed(2);state.transactions.unshift({id:uid('T'),userId:owner.id,type:'Spedizione',amount:-q.price,date:s.created,note:num});if(s.cod>0)state.cod.unshift({id:uid('COD'),clientId:owner.id,amount:s.cod,status:'In attesa',date:s.created,shipment:num});save();toast('Spedizione creata: '+num);currentView='shipments';render()}
function openUserModal(role){const parentOptions=role==='client'&&me().role==='super'?visibleMasters().map(m=>`<option value="${m.id}">${m.company}</option>`).join(''):'';const html=`<div class="modal-backdrop" id="modalBg"><div class="modal"><div class="modal-head"><h3>Nuovo ${roleLabel(role)}</h3><button class="modal-close" id="modalClose">×</button></div><form id="userCreate"><div class="modal-body"><div class="form-grid"><div class="field"><label>Nome e cognome</label><input id="nuName" required></div><div class="field"><label>Azienda</label><input id="nuCompany" required></div><div class="field"><label>Email</label><input id="nuEmail" type="email" required></div><div class="field"><label>Credito iniziale</label><input id="nuBalance" type="number" min="0" value="0"></div>${parentOptions?`<div class="field full"><label>Master di appartenenza</label><select id="nuParent">${parentOptions}</select></div>`:''}</div></div><div class="modal-foot"><button type="button" class="btn btn-secondary" id="modalCancel">Annulla</button><button class="btn btn-primary">Crea account</button></div></form></div></div>`;document.body.insertAdjacentHTML('beforeend',html);const close=()=>document.getElementById('modalBg')?.remove();modalClose.onclick=close;modalCancel.onclick=close;userCreate.onsubmit=e=>{e.preventDefault();const id=uid(role==='master'?'m':'c');const parentId=role==='master'?'u-sm':me().role==='master'?me().id:nuParent.value;state.users.push({id,name:nuName.value,company:nuCompany.value,email:nuEmail.value,password:'demo',role,balance:+nuBalance.value,parentId});save();close();toast(roleLabel(role)+' creato');render()}}
function rechargeDemo(){const u=me();u.balance=+(u.balance+100).toFixed(2);state.transactions.unshift({id:uid('T'),userId:u.id,type:'Ricarica',amount:100,date:new Date().toISOString().slice(0,10),note:'Ricarica demo'});save();toast('Ricarica demo di €100 effettuata');render()}
function doTracking(){const q=trackingInput.value.trim().toLowerCase();const s=visibleShipments().find(x=>x.id.toLowerCase()===q||x.tracking.toLowerCase()===q);const r=document.getElementById('trackingResult');if(!s){r.innerHTML=`<div class="notice" style="margin-top:16px">Spedizione non trovata nel tuo perimetro.</div>`;return}const steps=['Presa in carico','In transito','In consegna','Consegnata'],idx=Math.max(0,steps.indexOf(s.status));r.innerHTML=`<div style="margin-top:22px"><div class="entity-card"><div class="entity-top"><div class="carrier-logo">${s.carrier}</div><div><h4>${s.id}</h4><p>${s.recipient} · ${s.city} · ${s.tracking}</p></div></div><div class="timeline" style="margin-top:20px">${steps.map((x,i)=>`<div class="timeline-step ${i<idx?'done':i===idx?'current':''}"><div class="dot">${i+1}</div><div><strong>${x}</strong><p>${i<=idx?'Evento registrato':'In attesa'}</p></div></div>`).join('')}</div>${s.status==='Giacenza'?'<div class="notice">La spedizione risulta in giacenza. Nella versione completa qui potrai richiedere riconsegna, cambio indirizzo o reso.</div>':''}</div></div>`}
function exportCSV(){const rows=visibleShipments();const csv=['Numero,Destinatario,Citta,Corriere,Stato,Prezzo,Costo,Tracking',...rows.map(s=>[s.id,s.recipient,s.city,s.carrier,s.status,s.price,s.cost,s.tracking].map(v=>`"${String(v).replaceAll('"','""')}"`).join(','))].join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='aps-corriere-spedizioni.csv';a.click();URL.revokeObjectURL(url);toast('CSV esportato')}
function saveSettings(e){e.preventDefault();state.settings.brand=setBrand.value;state.settings.email=setEmail.value;state.settings.primary=setColor.value;save();document.documentElement.style.setProperty('--brand',setColor.value);toast('Impostazioni salvate')}

render();

</script>
